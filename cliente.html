<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Área do Cliente | Poliana Rebouças Advocacia</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0d1821">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script>try{var __t=JSON.parse(localStorage.getItem('pr_theme')||'null');if(__t){for(var __k in __t.vars)document.documentElement.style.setProperty(__k,__t.vars[__k]);document.documentElement.style.colorScheme=__t.cs;}}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0d1821;--navy2:#162030;--gold:#c9a84c;--gold-light:#e8c97a;--cream:#f8f5ef;--muted:#8a8070;--on-gold:#0d1821;--gold-rgb:201,168,76;--navy-rgb:13,24,33;--border:rgba(var(--gold-rgb),.2);--ok:#3aa57d;--warn:#d99a2b;--info:#3a8dde;--bad:#d1495b;}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none !important}
html{scroll-behavior:smooth}
body{font-family:'Montserrat',sans-serif;background:var(--navy);color:var(--cream);min-height:100vh;-webkit-font-smoothing:antialiased;font-weight:300}
button{font-family:inherit;cursor:pointer}
a{color:var(--gold)}
h1,h2,h3{font-family:'Cormorant Garamond',serif;font-weight:400}

/* topo */
.top{position:sticky;top:0;z-index:50;background:rgba(var(--navy-rgb),.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.top-in{max-width:1100px;margin:auto;padding:.8rem 1.5rem;display:flex;align-items:center;gap:1rem}
.brand{display:flex;flex-direction:column;line-height:1;text-decoration:none}
.brand b{font-family:'Cormorant Garamond',serif;font-size:1.5rem;color:var(--gold);letter-spacing:.06em;font-weight:600}
.brand small{font-size:.5rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.top-sp{flex:1}
.who{display:flex;flex-direction:column;align-items:flex-end;line-height:1.25;max-width:240px;min-width:0}.who b{font-size:.78rem;font-weight:600;color:var(--cream);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.who small{font-size:.6rem;letter-spacing:.06em;color:var(--gold);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{position:relative;background:none;border:1px solid var(--border);color:var(--cream);width:40px;height:40px;font-size:1rem;display:flex;align-items:center;justify-content:center}
.icon-btn:hover{border-color:var(--gold);color:var(--gold)}
.badge{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--bad);color:#fff;font-size:.62rem;font-weight:600;display:flex;align-items:center;justify-content:center}
.link-btn{background:none;border:none;color:var(--muted);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;padding:.4rem}
.link-btn:hover{color:var(--gold)}
.nav{max-width:1100px;margin:auto;padding:0 1.5rem;display:flex;gap:.2rem;overflow-x:auto}
.nav a{padding:.8rem 1rem;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-decoration:none;border-bottom:2px solid transparent;white-space:nowrap;display:flex;gap:.4rem;align-items:center}
.nav a:hover{color:var(--cream)}
.nav a.on{color:var(--gold);border-bottom-color:var(--gold)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--bad);display:inline-block}

main{max-width:1100px;margin:auto;padding:2rem 1.5rem 5rem}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1.6rem}
.page-h h1{font-size:2.1rem;line-height:1.1}
.page-h h1 em{color:var(--gold)}
.page-h p{font-size:.78rem;color:var(--muted);margin-top:.35rem}
.eyebrow{font-size:.62rem;letter-spacing:.25em;text-transform:uppercase;color:var(--gold);margin-bottom:.5rem}

/* botões e campos */
.btn{background:var(--gold);color:var(--on-gold);border:1px solid var(--gold);padding:.75rem 1.4rem;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.btn:hover{background:var(--gold-light)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--cream);border-color:var(--border)}
.btn.ghost:hover{border-color:var(--gold);color:var(--gold)}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:.5rem .9rem;font-size:.62rem}
.field{display:flex;flex-direction:column;gap:.35rem;margin-bottom:1rem}
.field label{font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea,.composer textarea{background:transparent;border:1px solid var(--border);color:var(--cream);padding:.7rem .8rem;font:inherit;font-size:.85rem;font-weight:400;outline:none;width:100%}
.field input:focus,.field select:focus,.field textarea:focus,.composer textarea:focus{border-color:var(--gold)}
.field input[readonly]{opacity:.6}
.field select option{background:var(--navy2);color:var(--cream)}
.field textarea{min-height:110px;resize:vertical;line-height:1.6}
.field small{font-size:.65rem;color:var(--muted);line-height:1.5}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0 1rem}
.check{display:flex;gap:.6rem;align-items:flex-start;font-size:.74rem;line-height:1.5;color:var(--muted);margin-bottom:1rem}
.check input{margin-top:.2rem;accent-color:var(--gold)}
.msg-err{color:var(--bad);font-size:.75rem;min-height:1.1rem;margin-bottom:.6rem}
.msg-ok{color:var(--ok);font-size:.75rem;margin-bottom:.6rem}

/* cartões */
.card{border:1px solid var(--border);background:var(--navy2);padding:1.4rem}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.8rem;margin-bottom:1.6rem}
.stat{border:1px solid var(--border);background:var(--navy2);padding:1rem 1.2rem}
.stat b{display:block;font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:400;color:var(--gold);line-height:1}
.stat span{font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:.6rem}
.item{display:flex;gap:1rem;align-items:center;border:1px solid var(--border);background:var(--navy2);padding:1rem 1.2rem;text-decoration:none;color:var(--cream);transition:border-color .2s}
.item:hover{border-color:var(--gold)}
.item .main{flex:1;min-width:0}
.item h3{font-size:1.2rem;line-height:1.2;margin-bottom:.2rem;display:flex;gap:.5rem;align-items:center}
.item p{font-size:.72rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .side{text-align:right;font-size:.65rem;color:var(--muted);display:flex;flex-direction:column;gap:.35rem;align-items:flex-end}
.chip{display:inline-block;padding:.18rem .6rem;border-radius:20px;font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;font-weight:500;border:1px solid currentColor}
.chip.s-info{color:var(--info)}.chip.s-warn{color:var(--warn)}.chip.s-ok{color:var(--ok)}.chip.s-mute{color:var(--muted)}.chip.s-purple{color:#9b6bd1}
.empty{text-align:center;padding:3rem 1rem;color:var(--muted);font-size:.82rem;line-height:1.7;border:1px dashed var(--border)}
.empty b{display:block;font-family:'Cormorant Garamond',serif;font-size:1.5rem;font-weight:400;color:var(--cream);margin-bottom:.4rem}
.toolbar{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:1rem}
.toolbar input,.toolbar select{background:transparent;border:1px solid var(--border);color:var(--cream);padding:.6rem .8rem;font:inherit;font-size:.8rem;outline:none}
.toolbar input{flex:1;min-width:180px}
.toolbar select option{background:var(--navy2)}

/* processo */
.p-head{border:1px solid var(--border);background:var(--navy2);padding:1.5rem;margin-bottom:1.2rem}
.p-head h1{font-size:1.9rem;margin:.2rem 0 .6rem}
.meta{display:flex;flex-wrap:wrap;gap:.4rem 1.6rem;font-size:.74rem;color:var(--muted);margin-bottom:.8rem}
.meta b{color:var(--cream);font-weight:400}
.p-desc{font-size:.85rem;line-height:1.7;color:var(--cream);white-space:pre-wrap}
.tabs{display:flex;gap:.2rem;border-bottom:1px solid var(--border);margin-bottom:1.2rem;overflow-x:auto}
.tabs button{background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);padding:.8rem 1.1rem;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;display:flex;gap:.4rem;align-items:center}
.tabs button.on{color:var(--gold);border-bottom-color:var(--gold)}
.back{display:inline-block;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-decoration:none;margin-bottom:1rem}
.back:hover{color:var(--gold)}

/* linha do tempo */
.tl{position:relative;padding-left:1.6rem}
.tl::before{content:'';position:absolute;left:5px;top:.5rem;bottom:.5rem;width:1px;background:var(--border)}
.tl-i{position:relative;margin-bottom:1.1rem;border:1px solid var(--border);background:var(--navy2);padding:1rem 1.2rem}
.tl-i::before{content:'';position:absolute;left:-1.6rem;top:1.15rem;width:11px;height:11px;border-radius:50%;background:var(--gold);border:2px solid var(--navy)}
.tl-i .d{font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.tl-i h4{font-family:'Cormorant Garamond',serif;font-size:1.25rem;font-weight:400;margin:.2rem 0 .4rem}
.tl-i p{font-size:.82rem;line-height:1.7;white-space:pre-wrap}
.tl-i .x{float:right;background:none;border:none;color:var(--muted);font-size:1rem}
.tl-i .x:hover{color:var(--bad)}
.atts{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.6rem}
.att{background:rgba(var(--gold-rgb),.08);border:1px solid var(--border);color:var(--cream);padding:.35rem .7rem;font-size:.7rem;font-weight:400;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att:hover{border-color:var(--gold)}
.att i{font-style:normal;color:var(--muted);margin-left:.3rem}
.dh{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;align-items:flex-start;margin-bottom:1rem}
.dh .hint{margin-top:.3rem;max-width:520px}
.dl{display:flex;flex-direction:column;gap:.7rem}
.dc{border:1px solid var(--border);background:var(--navy2);padding:1rem 1.1rem;border-left:3px solid var(--border)}
.dc.pend{border-left-color:#e0a63c}.dc.env{border-left-color:#5aa0d8}.dc.rec{border-left-color:#5cb85c}
.dc h4{font-family:'Cormorant Garamond',serif;font-size:1.2rem;font-weight:500;margin:.1rem 0 .2rem}
.dc p{font-size:.78rem;color:var(--muted);line-height:1.6;white-space:pre-wrap}
.dc .top2{display:flex;justify-content:space-between;gap:.6rem;align-items:flex-start;flex-wrap:wrap}
.dc .acts2{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.8rem}
.dc small{font-size:.62rem;color:var(--muted);letter-spacing:.04em}
.dpend{color:#e0a63c}.denv{color:#5aa0d8}.drec{color:#5cb85c}
.sec-t{font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin:1.6rem 0 .7rem;display:flex;align-items:center;gap:.6rem}
.sec-t::after{content:'';flex:1;height:1px;background:var(--border)}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media(max-width:800px){.dgrid{grid-template-columns:1fr}}
.pnl{border:1px solid var(--border);background:var(--navy2);padding:1rem 1.1rem}
.pnl h3{font-family:'Montserrat',sans-serif;font-size:.64rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:500;margin-bottom:.8rem}
.bar{display:grid;grid-template-columns:130px 1fr 28px;gap:.6rem;align-items:center;font-size:.72rem;margin:.4rem 0}
.bar>span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.bar i{display:block;height:10px;background:rgba(255,255,255,.06)}
.bar i b{display:block;height:100%;background:var(--gold)}
.bar em{font-style:normal;text-align:right;color:var(--cream)}
.mini{display:flex;flex-direction:column;gap:.1rem}
.mini a,.mini div{display:flex;justify-content:space-between;gap:.8rem;font-size:.76rem;padding:.5rem 0;border-bottom:1px solid var(--border);color:var(--cream);text-decoration:none}
.mini a:hover{color:var(--gold)}
.mini small{color:var(--muted);font-size:.66rem;text-align:right}
.mini .none{color:var(--muted);border:none;font-size:.74rem}
.cal{border:1px solid var(--border);background:var(--navy2);padding:.8rem;margin-bottom:1rem}
.cal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:.6rem}
.cal-h b{font-family:'Cormorant Garamond',serif;font-size:1.3rem;font-weight:500}
.cal-h button{background:none;border:1px solid var(--border);color:var(--cream);width:34px;height:34px;cursor:pointer;font-size:1rem}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-g .wd{font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center;padding:.2rem 0}
.cal-g button{background:transparent;border:1px solid transparent;color:var(--cream);height:44px;font:inherit;font-size:.78rem;cursor:pointer;position:relative}
.cal-g button:hover{border-color:var(--gold)}
.cal-g button.out{opacity:.3}.cal-g button.today{border-color:rgba(201,168,76,.6)}.cal-g button.sel{background:var(--gold);color:#0d1821}
.cal-g button i{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);display:flex;gap:2px}
.cal-g button i u{width:5px;height:5px;border-radius:50%;background:#5aa0d8;display:block}.cal-g button i u.a{background:#e0a63c}
.ev{display:flex;gap:1rem;border:1px solid var(--border);background:var(--navy2);padding:.9rem 1rem;border-left:3px solid #5aa0d8;margin-bottom:.7rem}
.ev.solicitado{border-left-color:#e0a63c}.ev.cancelado{opacity:.55;border-left-color:var(--border)}.ev.realizado{border-left-color:#5cb85c}
.ev.aud{border-left-color:#c9a84c}
.ev-date{min-width:54px;text-align:center}.ev-date b{display:block;font-family:'Cormorant Garamond',serif;font-size:1.9rem;line-height:1;color:var(--gold);font-weight:400}.ev-date span{font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ev-main{flex:1;min-width:0}.ev-top{display:flex;justify-content:space-between;gap:.6rem;align-items:flex-start;flex-wrap:wrap}
.ev-main h4{font-family:'Cormorant Garamond',serif;font-size:1.2rem;font-weight:500}
.ev-main p{font-size:.74rem;color:var(--muted);line-height:1.6;margin-top:.15rem;word-break:break-word}.ev-main p a{color:var(--gold)}
.ev-main .acts2{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.7rem}
.kb{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem;align-items:start}
.kb-col{border:1px solid var(--border);background:rgba(255,255,255,.02);min-height:240px;display:flex;flex-direction:column}
.kb-col.over{border-color:var(--gold);background:rgba(201,168,76,.06)}
.kb-h{display:flex;justify-content:space-between;align-items:center;padding:.8rem .9rem;border-bottom:1px solid var(--border);border-top:3px solid #5aa0d8}
.kb-col[data-col=andamento] .kb-h{border-top-color:#e0a63c}.kb-col[data-col=concluido] .kb-h{border-top-color:#5cb85c}
.kb-h b{font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;font-weight:500}.kb-h b small{color:var(--muted);margin-left:.4rem;font-size:.7rem}
.kb-h button{background:none;border:1px solid var(--border);color:var(--gold);width:28px;height:28px;cursor:pointer;font-size:1.1rem;line-height:1}
.kb-l{padding:.7rem;display:flex;flex-direction:column;gap:.6rem;flex:1}
.kb-c{background:var(--navy2);border:1px solid var(--border);padding:.8rem .9rem;cursor:pointer;position:relative}
.kb-c:hover{border-color:var(--gold)}.kb-c.drag{opacity:.4}
.kb-c h4{font-family:'Cormorant Garamond',serif;font-size:1.08rem;font-weight:500;line-height:1.25;margin:.25rem 0}
.kb-c p{font-size:.72rem;color:var(--muted);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.kb-c.done h4{text-decoration:line-through;color:var(--muted)}
.kb-f{display:flex;justify-content:space-between;align-items:center;gap:.5rem;margin-top:.6rem;flex-wrap:wrap}
.kb-f small{font-size:.64rem;color:var(--muted)}.kb-f small.late{color:#e0605c;font-weight:600}
.av{display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--gold);color:#0d1821;font-size:.6rem;font-weight:700;align-items:center;justify-content:center;margin-left:-6px;border:2px solid var(--navy2)}
.avs{display:flex;padding-left:6px}
.pri{font-size:.56rem;letter-spacing:.12em;text-transform:uppercase;font-weight:600;padding:.12rem .45rem;border:1px solid currentColor;border-radius:20px}
.pri.alta{color:#e0605c}.pri.media{color:#e0a63c}.pri.baixa{color:#5aa0d8}
.kb-mv{display:flex;gap:.3rem;margin-top:.5rem}.kb-mv button{flex:1;background:transparent;border:1px solid var(--border);color:var(--muted);padding:.3rem;cursor:pointer;font-size:.7rem}
.kb-mv button:hover{color:var(--gold);border-color:var(--gold)}
.pp{display:flex;flex-wrap:wrap;gap:.4rem}.pp label{display:flex;gap:.4rem;align-items:center;border:1px solid var(--border);padding:.35rem .6rem;font-size:.74rem;cursor:pointer}
.pp input{width:auto}
@media(max-width:900px){.kb{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:.8rem;padding-bottom:.6rem}.kb-col{min-width:84%;scroll-snap-align:start}}
.ag-tabs{display:flex;gap:.4rem;margin-bottom:1rem;flex-wrap:wrap}
.ag-tabs button{background:transparent;border:1px solid var(--border);color:var(--muted);padding:.45rem .9rem;font:inherit;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.ag-tabs button.on{border-color:var(--gold);color:var(--gold)}

/* conversa */
.chat{border:1px solid var(--border);background:var(--navy2);display:flex;flex-direction:column;height:min(620px,70vh)}
.chat-list{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:.5rem}
.day{align-self:center;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:.5rem 0}
.bub{max-width:78%;padding:.6rem .85rem;font-size:.84rem;line-height:1.55;font-weight:400;border:1px solid var(--border);background:var(--navy);white-space:pre-wrap;word-break:break-word}
.bub.me{align-self:flex-end;background:rgba(var(--gold-rgb),.16);border-color:rgba(var(--gold-rgb),.5)}
.bub small{display:block;font-size:.58rem;color:var(--muted);margin-top:.25rem;letter-spacing:.05em}
.bub .who2{font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);display:block;margin-bottom:.15rem}
.composer{border-top:1px solid var(--border);padding:.7rem;display:flex;flex-direction:column;gap:.5rem}
.composer .r{display:flex;gap:.5rem;align-items:flex-end}
.composer textarea{min-height:44px;max-height:140px;resize:none;border:1px solid var(--border)}
.composer .chips{display:flex;gap:.4rem;flex-wrap:wrap}
.composer .chips span{font-size:.68rem;background:rgba(var(--gold-rgb),.1);border:1px solid var(--border);padding:.25rem .5rem}
.composer .chips button{background:none;border:none;color:var(--bad);margin-left:.3rem}
.hint{font-size:.66rem;color:var(--muted);line-height:1.5}

/* modal, toast, bell */
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:4vh 1rem;overflow:auto}
.modal{background:var(--navy);border:1px solid var(--gold);width:100%;max-width:560px;padding:1.8rem;position:relative;margin:auto}
.modal h2{font-size:1.7rem;margin-bottom:1.2rem}
.modal .x{position:absolute;top:.7rem;right:.9rem;background:none;border:none;color:var(--muted);font-size:1.2rem}
.modal .acts{display:flex;gap:.6rem;justify-content:flex-end;flex-wrap:wrap;margin-top:.5rem}
.toast{position:fixed;left:50%;bottom:1.5rem;transform:translateX(-50%) translateY(30px);background:var(--gold);color:var(--on-gold);padding:.8rem 1.4rem;font-size:.78rem;font-weight:500;z-index:200;opacity:0;transition:.3s;max-width:90vw;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.toast.err{background:var(--bad);color:#fff}
.bell-box{position:absolute;right:1.5rem;top:100%;width:min(360px,92vw);background:var(--navy);border:1px solid var(--gold);z-index:60;max-height:60vh;overflow:auto;box-shadow:0 14px 40px rgba(0,0,0,.5)}
.bell-box a{display:block;padding:.8rem 1rem;border-bottom:1px solid var(--border);text-decoration:none;color:var(--cream);font-size:.78rem}
.bell-box a:hover{background:rgba(var(--gold-rgb),.08)}
.bell-box a small{display:block;color:var(--muted);font-size:.66rem;margin-top:.2rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bell-box p{padding:1rem;font-size:.75rem;color:var(--muted)}
.light{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:150;display:flex;align-items:center;justify-content:center;padding:1rem}
.light img{max-width:100%;max-height:92vh}
.light a{position:absolute;top:1rem;right:1rem;color:#fff;font-size:1.6rem;text-decoration:none}

/* entrar */
.auth{max-width:440px;margin:6vh auto;padding:0 1.2rem}
.auth .card{padding:2rem}
.auth h1{font-size:2.2rem;text-align:center;line-height:1.1}
.auth h1 em{color:var(--gold)}
.auth .sub{text-align:center;font-size:.78rem;color:var(--muted);line-height:1.6;margin:.6rem 0 1.4rem}
.auth .tabs{margin-bottom:1.3rem}
.auth .tabs button{flex:1;justify-content:center}
.gbtn{width:100%;display:flex;gap:.6rem;align-items:center;justify-content:center;background:#fff;color:#222;border:none;padding:.75rem;font-size:.78rem;font-weight:500;margin-bottom:1rem}
.or{display:flex;align-items:center;gap:.8rem;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:1rem}
.or::before,.or::after{content:'';flex:1;height:1px;background:var(--border)}
.center{text-align:center}
.loading{text-align:center;padding:5rem 1rem;color:var(--muted);font-size:.8rem;letter-spacing:.14em;text-transform:uppercase}
.back-site{display:block;text-align:center;margin-top:1.2rem;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-decoration:none}
.sep{height:1px;background:var(--border);margin:1.4rem 0}
.danger-zone{margin-top:2rem;padding-top:1.2rem;border-top:1px dashed var(--bad)}

@media (max-width:700px){
  main{padding:1.4rem 1rem 4rem}.top-in{padding:.7rem 1rem}.nav{padding:0 .5rem}.who{max-width:130px}.who small .em{display:none}
  .page-h h1{font-size:1.7rem}.row2{grid-template-columns:1fr;gap:0}.item{flex-wrap:wrap}.item .side{flex-direction:row;align-items:center;width:100%;justify-content:space-between}
  .bub{max-width:90%}.chat{height:75vh}.bell-box{right:.5rem}
}
</style>

<body>
<div id="root"><div class="loading">Carregando…</div></div>
<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, sendPasswordResetEmail, GoogleAuthProvider, signInWithPopup, updateProfile }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, doc, getDoc, getDocs, setDoc, addDoc, updateDoc, deleteDoc, collection, query, where, orderBy, onSnapshot, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAReoHhPsxpE4nVVrgt13fbDDkeHK6WUEA",
  authDomain: "webpagepoliana.firebaseapp.com",
  projectId: "webpagepoliana",
  storageBucket: "webpagepoliana.firebasestorage.app",
  messagingSenderId: "985638470397",
  appId: "1:985638470397:web:e2e9412c5d9bec0c8b3494"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const MAIN_ADMIN = 'poli.reboucas@gmail.com';                                    // administrador principal (único que cadastra acessos)
const ADMIN_EMAILS = [MAIN_ADMIN, 'polireboucas@gmail.com'];                    // advogadas (acesso total ao portal)
const STATUS = [
  ['analise', 'Em análise', 's-purple'], ['andamento', 'Em andamento', 's-info'], ['cliente', 'Aguardando cliente', 's-warn'],
  ['decisao', 'Aguardando decisão', 's-warn'], ['suspenso', 'Suspenso', 's-mute'], ['concluido', 'Concluído', 's-ok'], ['arquivado', 'Arquivado', 's-mute']
];
const AREAS = ['Direito Civil', 'Direito do Consumidor', 'Direito de Família', 'Direito Penal', 'Direito do Trabalho', 'Direito Empresarial', 'Direito Tributário', 'Direito Administrativo', 'Direito Previdenciário'];

/* ---------- utilitários ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ms = t => t ? (t.toMillis ? t.toMillis() : (t.seconds ? t.seconds * 1000 : Number(t) || 0)) : 0;
const fmtD = t => { const m = ms(t); return m ? new Date(m).toLocaleDateString('pt-BR') : ''; };
const fmtDT = t => { const m = ms(t); return m ? new Date(m).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : ''; };
const fmtHM = t => { const m = ms(t); return m ? new Date(m).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : ''; };
const fmtDia = m => new Date(m).toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: 'short' }).replace(/\./g, '');
const fmtISO = s => s ? s.split('-').reverse().join('/') : '';
const fsize = n => n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(0) + ' KB' : (n / 1048576).toFixed(1) + ' MB';
const statusOf = id => STATUS.find(s => s[0] === id) || STATUS[1];
const chip = id => { const s = statusOf(id); return `<span class="chip ${s[2]}">${s[1]}</span>`; };
const firstName = n => String(n || '').trim().split(/\s+/)[0] || '';
let toastT;
function toast(msg, err) {
  const t = $('#toast'); t.textContent = msg; t.className = 'toast on' + (err ? ' err' : '');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), err ? 5000 : 3200);
}
function openModal(html, mount) {
  const root = $('#modalRoot');
  root.innerHTML = `<div class="modal-back"><div class="modal"><button class="x" data-close aria-label="Fechar">✕</button>${html}</div></div>`;
  const close = () => { root.innerHTML = ''; };
  root.querySelector('.modal-back').addEventListener('mousedown', e => { if (e.target.classList.contains('modal-back')) close(); });
  root.querySelector('[data-close]').onclick = close;
  mount && mount(root.querySelector('.modal'), close);
  return close;
}
function confirmBox(texto, rotulo = 'Confirmar') {
  return new Promise(res => {
    const close = openModal(`<h2>Confirmar</h2><p style="font-size:.85rem;line-height:1.6;margin-bottom:1.2rem">${texto}</p>
      <div class="acts"><button class="btn ghost sm" data-no>Cancelar</button><button class="btn danger sm" data-yes>${rotulo}</button></div>`,
      (m, c) => { m.querySelector('[data-no]').onclick = () => { c(); res(false); }; m.querySelector('[data-yes]').onclick = () => { c(); res(true); }; });
  });
}
const errMsg = e => ({
  'auth/invalid-credential': 'E-mail ou senha incorretos.', 'auth/wrong-password': 'E-mail ou senha incorretos.', 'auth/user-not-found': 'E-mail ou senha incorretos.',
  'auth/invalid-email': 'E-mail inválido.', 'auth/email-already-in-use': 'Este e-mail já tem cadastro. Use “Entrar” ou “Esqueci a senha”.',
  'auth/weak-password': 'A senha precisa ter pelo menos 6 caracteres.', 'auth/too-many-requests': 'Muitas tentativas. Aguarde um pouco e tente de novo.',
  'auth/popup-closed-by-user': '', 'auth/cancelled-popup-request': '', 'auth/network-request-failed': 'Sem conexão com a internet.',
  'auth/operation-not-allowed': 'Este tipo de login ainda não foi ativado no Firebase.', 'auth/unauthorized-domain': 'Este site ainda não foi autorizado no Firebase (Authentication → Domínios).',
  'permission-denied': 'Sem permissão para esta ação. Confira se as regras do Firestore foram publicadas.'
}[e?.code] ?? 'Algo deu errado. Tente novamente.');

/* ---------- estado ---------- */
const S = { user: null, admin: false, profile: null, clientes: [], processos: [], chats: [], workerUrl: '', r2: false, unsubs: [], view: null, seen: null, bellOpen: false, pending: null, docs: {}, docSub: new Set(), eventos: [], agMes: null, agDia: '', team: false, equipe: [], tarefas: [], siteAdmin: false, main: false };
const clienteById = uid => S.clientes.find(c => c.id === uid);
const clienteNome = uid => S.admin ? (clienteById(uid)?.nome || 'Cliente') : (S.profile?.nome || 'Você');

/* ---------- Cloudflare Worker (arquivos + e-mails) ---------- */
async function api(path, opts = {}) {
  if (!S.workerUrl) throw new Error('O envio de arquivos ainda não foi configurado.');
  const token = await auth.currentUser.getIdToken();
  const r = await fetch(S.workerUrl.replace(/\/$/, '') + path, { ...opts, headers: { ...(opts.headers || {}), Authorization: 'Bearer ' + token } });
  if (!r.ok) { let m = 'Falha na comunicação com o servidor de arquivos.'; try { m = (await r.json()).erro || m; } catch { /* ok */ } throw new Error(m); }
  return r;
}
const MAXFS = 700 * 1024;                       // arquivos guardados no Firestore: até 700 KB
const BLOCKED_EXT = /\.(exe|bat|cmd|com|scr|msi|js|vbs|ps1|jar|apk|dll|sh)$/i;
const useR2 = () => !!(S.workerUrl && S.r2);   // com o Worker + R2 configurados, aceita até 15 MB
const maxPick = f => useR2() ? 15 * 1048576 : (/^image\//.test(f.type) ? 25 * 1048576 : MAXFS);
const limitTxt = () => useR2() ? 'arquivos até 15 MB' : 'fotos e PDFs leves, até 700 KB cada';
function acceptFiles(input, list) {
  for (const f of input.files) {
    if (BLOCKED_EXT.test(f.name)) toast(`“${f.name}”: tipo de arquivo não permitido.`, true);
    else if (f.size > maxPick(f)) toast(`“${f.name}” é grande demais (${limitTxt()}).`, true);
    else if (list.length < 5) list.push(f);
  }
  input.value = '';
}
async function shrinkImage(f) {                 // reduz fotos para caberem no limite
  if (!/^image\/(jpeg|png|webp)$/.test(f.type)) return f;
  const bmp = await createImageBitmap(f).catch(() => null); if (!bmp) return f;
  let max = 1800, q = 0.82, blob = f;
  for (let i = 0; i < 6; i++) {
    const sc = Math.min(1, max / Math.max(bmp.width, bmp.height)), c = document.createElement('canvas');
    c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    blob = await new Promise(r => c.toBlob(r, 'image/jpeg', q));
    if (blob.size <= MAXFS) break; max *= 0.8; q = Math.max(0.5, q - 0.06);
  }
  return new File([blob], f.name.replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' });
}
const readDataURL = f => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(f); });
async function uploadFiles(files, scope, id) {
  const out = [];
  for (let f of files) {
    if (useR2()) {
      const r = await api(`/upload?scope=${scope}&id=${encodeURIComponent(id)}&name=${encodeURIComponent(f.name)}`, { method: 'POST', headers: { 'Content-Type': f.type || 'application/octet-stream' }, body: f });
      out.push(await r.json()); continue;
    }
    f = await shrinkImage(f);
    if (f.size > MAXFS) throw new Error(`“${f.name}” é grande demais (${limitTxt()}).`);
    const data = await readDataURL(f);
    if (data.length > 980000) throw new Error(`“${f.name}” é grande demais (${limitTxt()}).`);
    const ref = await addDoc(collection(db, scope === 'c' ? 'chats' : 'processos', id, 'arquivos'),
      { nome: f.name.slice(0, 150), tipo: (f.type || 'application/octet-stream').slice(0, 100), tamanho: f.size, data, autorUid: auth.currentUser.uid, criadoAt: serverTimestamp() });
    out.push({ key: `fs:${scope}:${id}:${ref.id}`, nome: f.name.slice(0, 150), tamanho: f.size, tipo: f.type || '' });
  }
  return out;
}
const notify = (kind, id) => { if (S.workerUrl) api('/notify', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ kind, id }) }).catch(() => {}); };
const ATT = new Map();
const attHtml = list => (list && list.length) ? `<div class="atts">${list.map(a => { ATT.set(a.key, a); return `<button type="button" class="att" data-att="${esc(a.key)}">📎 ${esc(a.nome)}<i>${fsize(a.tamanho || 0)}</i></button>`; }).join('')}</div>` : '';
async function openAttachment(key) {
  const a = ATT.get(key); if (!a) return;
  try {
    toast('Abrindo arquivo…');
    let blob;
    if (key.startsWith('fs:')) {
      const [, sc, id, fid] = key.split(':');
      const d = await getDoc(doc(db, sc === 'c' ? 'chats' : 'processos', id, 'arquivos', fid));
      if (!d.exists()) throw new Error('Arquivo não encontrado.');
      blob = await (await fetch(d.data().data)).blob();
    } else blob = await (await api('/file?key=' + encodeURIComponent(key))).blob();
    const url = URL.createObjectURL(blob);
    if ((a.tipo || '').startsWith('image/')) {
      const d = document.createElement('div'); d.className = 'light';
      d.innerHTML = `<a href="#" aria-label="Fechar">✕</a><img src="${url}" alt="${esc(a.nome)}">`;
      d.onclick = e => { e.preventDefault(); d.remove(); URL.revokeObjectURL(url); }; document.body.appendChild(d);
    } else {
      const l = document.createElement('a'); l.href = url; l.download = a.nome; document.body.appendChild(l); l.click(); l.remove();
      setTimeout(() => URL.revokeObjectURL(url), 30000);
    }
  } catch (e) { toast(e.message, true); }
}
document.addEventListener('click', e => { const b = e.target.closest('[data-att]'); if (b) openAttachment(b.dataset.att); });

/* ---------- não lidos / sino ---------- */
const chatUnread = c => { const last = ms(c.ultimaMsgAt), seen = ms(S.admin ? c.lidoAdv : c.lidoCliente); return !!last && last > seen && c.ultimaMsgPor !== (S.admin ? 'adv' : 'cliente'); };
const procUnread = p => !S.admin && ms(p.atualizadoAt) > ms(p.lidoCliente);
const chatTitle = c => c.processoId ? (S.processos.find(p => p.id === c.processoId)?.numero ? 'Processo ' + S.processos.find(p => p.id === c.processoId).numero : (c.titulo || 'Processo')) : 'Conversa geral';
const chatHref = c => c.processoId ? `#/p/${c.processoId}/chat` : (S.admin ? `#/chat/${c.id}` : '#/mensagens');
function unreadItems() {
  const it = [];
  S.chats.filter(chatUnread).forEach(c => it.push({ key: 'c' + c.id + ms(c.ultimaMsgAt), at: ms(c.ultimaMsgAt), title: (S.admin ? clienteNome(c.clienteUid) + ' · ' : '') + chatTitle(c), sub: c.ultimaMsgTexto || 'Nova mensagem', href: chatHref(c), kind: 'msg' }));
  S.processos.filter(procUnread).forEach(p => it.push({ key: 'p' + p.id + ms(p.atualizadoAt), at: ms(p.atualizadoAt), title: 'Processo ' + p.numero, sub: p.ultimoAviso || 'Atualização no processo', href: `#/p/${p.id}`, kind: 'proc' }));
  tkNovas().forEach(t => it.push({ key: 't' + t.id + (t.responsaveis || []).join(), at: ms(t.atualizadoAt) || ms(t.criadoAt), title: 'Nova tarefa: ' + t.titulo, sub: t.criadoPorNome ? 'Atribuída por ' + t.criadoPorNome : 'Atribuída a você', href: '#/tarefas', kind: 'task' }));
  return it.sort((a, b) => b.at - a.at);
}
function renderBell() {
  const items = unreadItems(), n = items.length;
  const btn = $('#bell'); if (!btn) return;
  btn.innerHTML = `🔔${n ? `<span class="badge">${n > 9 ? '9+' : n}</span>` : ''}`;
  document.title = (n ? `(${n}) ` : '') + 'Área do Cliente | Poliana Rebouças Advocacia';
  const box = $('#bellBox');
  if (box) box.innerHTML = n ? items.map(i => `<a href="${i.href}">${i.kind === 'msg' ? '💬' : i.kind === 'task' ? '📋' : '📌'} ${esc(i.title)}<small>${esc(i.sub)}</small></a>`).join('') : '<p>Nenhuma novidade por enquanto.</p>';
  // aviso quando chega algo novo com a página aberta
  const keys = new Set(items.map(i => i.key));
  if (S.seen) items.filter(i => !S.seen.has(i.key)).slice(0, 1).forEach(i => toast((i.kind === 'msg' ? '💬 Nova mensagem: ' : '📌 ') + i.title));
  S.seen = keys;
}
const stat = (n, l) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`;

/* ---------- entrada ---------- */
function viewAuth(mode = 'login') {
  S.view?.destroy?.(); S.view = null;
  $('#root').innerHTML = `
  <div class="auth"><div class="card">
    <div class="center"><span class="brand" style="align-items:center"><b>PR</b><small>Advocacia</small></span></div>
    <h1 style="margin-top:1rem">Área do <em>cliente</em></h1>
    <p class="sub">Acompanhe seus processos, envie documentos e converse diretamente com a advogada, com sigilo e segurança.</p>
    <div class="tabs"><button class="${mode === 'login' ? 'on' : ''}" data-m="login">Entrar</button><button class="${mode === 'reg' ? 'on' : ''}" data-m="reg">Criar conta</button></div>
    <button class="gbtn" id="gBtn"><svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.5-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.9 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>Continuar com Google</button>
    <div class="or">ou com e-mail</div>
    <form id="authForm" novalidate>
      ${mode === 'reg' ? `<div class="field"><label>Nome completo</label><input name="nome" autocomplete="name" required maxlength="150"></div>
      <div class="field"><label>Telefone / WhatsApp</label><input name="tel" type="tel" autocomplete="tel" placeholder="(00) 00000-0000" required maxlength="40"></div>` : ''}
      <div class="field"><label>E-mail</label><input name="email" type="email" autocomplete="email" required maxlength="150"></div>
      <div class="field"><label>Senha</label><input name="senha" type="password" autocomplete="${mode === 'reg' ? 'new-password' : 'current-password'}" required minlength="6"></div>
      ${mode === 'reg' ? `<label class="check"><input type="checkbox" name="lgpd" required> <span>Concordo com o tratamento dos meus dados e documentos para fins de atendimento jurídico, com sigilo profissional (LGPD).</span></label>` : ''}
      <p class="msg-err" id="authErr"></p>
      <button class="btn" style="width:100%" id="authBtn">${mode === 'reg' ? 'Criar minha conta' : 'Entrar'}</button>
      ${mode === 'login' ? '<p class="center" style="margin-top:1rem"><button type="button" class="link-btn" id="forgot">Esqueci minha senha</button></p>' : ''}
    </form>
  </div><a class="back-site" href="index.html">← Voltar ao site</a></div>`;
  $$('.tabs [data-m]').forEach(b => b.onclick = () => viewAuth(b.dataset.m));
  const err = m => { $('#authErr').textContent = m || ''; };
  $('#gBtn').onclick = async () => { try { await signInWithPopup(auth, new GoogleAuthProvider()); } catch (e) { err(errMsg(e)); } };
  $('#forgot')?.addEventListener('click', async () => {
    const email = $('#authForm').email.value.trim();
    if (!email) return err('Digite seu e-mail acima e clique novamente.');
    try { await sendPasswordResetEmail(auth, email); $('#authErr').className = 'msg-ok'; err('Enviamos um link para redefinir a senha no seu e-mail.'); } catch (e) { err(errMsg(e)); }
  });
  $('#authForm').onsubmit = async e => {
    e.preventDefault(); const f = e.target; err(''); $('#authErr').className = 'msg-err';
    const email = f.email.value.trim(), senha = f.senha.value;
    if (!email || !senha) return err('Preencha e-mail e senha.');
    const btn = $('#authBtn'); btn.disabled = true;
    try {
      if (mode === 'reg') {
        const nome = f.nome.value.trim(), tel = f.tel.value.trim();
        if (nome.length < 3) throw { code: 'x', msg: 'Informe seu nome completo.' };
        if (tel.replace(/\D/g, '').length < 10) throw { code: 'x', msg: 'Informe um telefone com DDD.' };
        if (!f.lgpd.checked) throw { code: 'x', msg: 'É preciso aceitar o tratamento de dados para criar a conta.' };
        S.pending = { nome, telefone: tel };
        const cred = await createUserWithEmailAndPassword(auth, email, senha);
        try { await updateProfile(cred.user, { displayName: nome }); } catch { /* ok */ }
      } else await signInWithEmailAndPassword(auth, email, senha);
    } catch (x) { S.pending = null; err(x.msg || errMsg(x)); btn.disabled = false; }
  };
}

/* ---------- casca (topo + menu) ---------- */
const selfName = () => S.profile?.nome || S.equipe.find(x => x.id === me())?.nome || S.user.displayName || (S.admin ? 'Advogada' : (S.user.email || '').split('@')[0]);
const whoHtml = () => `<b>${esc(selfName())}</b><small>${S.admin ? '⚖ Advogada' : S.team ? '👥 Equipe' : '👤 Cliente'}<span class="em"> · ${esc(S.user.email || '')}</span></small>`;
function updateWho() { const w = $('#who'); if (w) w.innerHTML = whoHtml(); }
function renderShell() {
  const nav = S.team ? [['#/tarefas', 'Tarefas']] : S.admin

/* ---------- conversa (reutilizável) ---------- */
function mountChat(box, chatId, titulo) {
  box.innerHTML = `<div class="chat"><div class="chat-list"></div>
    <form class="composer"><div class="chips"></div>
      <div class="r"><button type="button" class="btn ghost sm" data-attach title="Anexar arquivo">📎</button>
      <textarea rows="1" placeholder="Escreva sua mensagem…" maxlength="4000"></textarea>
      <button class="btn sm" data-send>Enviar</button></div>
      <input type="file" multiple hidden>
      <p class="hint">Enter envia · Shift+Enter quebra a linha · ${limitTxt()}</p>
    </form></div>`;
  const list = $('.chat-list', box), ta = $('textarea', box), chips = $('.chips', box), fileIn = $('input[type=file]', box), sendBtn = $('[data-send]', box);
  let msgs = [], files = [], sending = false;
  const myTipo = S.admin ? 'adv' : 'cliente';
  const draw = () => {
    const near = list.scrollHeight - list.scrollTop - list.clientHeight < 120;
    let lastDay = '';
    list.innerHTML = msgs.length ? msgs.map(m => {
      const day = fmtD(m.criadoAt), sep = day !== lastDay ? `<div class="day">${day}</div>` : ''; lastDay = day;
      const mine = m.autorTipo === myTipo;
      return `${sep}<div class="bub ${mine ? 'me' : ''}">${mine ? '' : `<span class="who2">${m.autorTipo === 'adv' ? 'Advogada' : esc(m.autorNome)}</span>`}${esc(m.texto)}${attHtml(m.anexos)}<small>${fmtHM(m.criadoAt)}</small></div>`;
    }).join('') : '<div class="empty" style="margin:auto;border:none"><b>Nenhuma mensagem ainda</b>Escreva abaixo para iniciar a conversa.</div>';
    if (near) list.scrollTop = list.scrollHeight;
  };
  const markRead = () => {
    const c = S.chats.find(x => x.id === chatId);
    if (c && chatUnread(c) && document.visibilityState === 'visible') updateDoc(doc(db, 'chats', chatId), { [S.admin ? 'lidoAdv' : 'lidoCliente']: serverTimestamp() }).catch(() => {});
  };
  const unsub = onSnapshot(query(collection(db, 'chats', chatId, 'msgs'), orderBy('criadoAt', 'asc')), snap => {
    msgs = snap.docs.map(d => ({ id: d.id, ...d.data({ serverTimestamps: 'estimate' }) })); draw(); markRead();
  }, () => { list.innerHTML = '<div class="empty" style="margin:auto;border:none">Não foi possível carregar a conversa.</div>'; });
  draw(); list.scrollTop = list.scrollHeight;
  const drawChips = () => { chips.innerHTML = files.map((f, i) => `<span>📎 ${esc(f.name)} (${fsize(f.size)})<button type="button" data-rm="${i}">✕</button></span>`).join(''); };
  $('[data-attach]', box).onclick = () => fileIn.click();
  fileIn.onchange = () => { acceptFiles(fileIn, files); drawChips(); };
  chips.onclick = e => { const b = e.target.closest('[data-rm]'); if (b) { files.splice(+b.dataset.rm, 1); drawChips(); } };
  ta.oninput = () => { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 140) + 'px'; };
  ta.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey && innerWidth > 700) { e.preventDefault(); $('.composer', box).requestSubmit(); } };
  $('.composer', box).onsubmit = async e => {
    e.preventDefault(); if (sending) return;
    const texto = ta.value.trim(); if (!texto && !files.length) return;
    sending = true; sendBtn.disabled = true; sendBtn.textContent = files.length ? 'Enviando…' : 'Enviar';
    try {
      const anexos = files.length ? await uploadFiles(files, 'c', chatId) : [];
      const nome = S.admin ? 'Advogada' : (S.profile?.nome || S.user.displayName || S.user.email);
      await addDoc(collection(db, 'chats', chatId, 'msgs'), { autorUid: S.user.uid, autorNome: nome, autorTipo: myTipo, texto: texto || '(arquivo)', anexos, criadoAt: serverTimestamp() });
      await updateDoc(doc(db, 'chats', chatId), { ultimaMsgAt: serverTimestamp(), ultimaMsgPor: myTipo, ultimaMsgTexto: (texto || '📎 ' + anexos[0]?.nome).slice(0, 90), [S.admin ? 'lidoAdv' : 'lidoCliente']: serverTimestamp() });
      notify('msg', chatId);
      ta.value = ''; ta.style.height = 'auto'; files = []; drawChips();
    } catch (x) { toast(x.message?.includes('permission') ? errMsg({ code: 'permission-denied' }) : (x.message || 'Não foi possível enviar.'), true); }
    sending = false; sendBtn.disabled = false; sendBtn.textContent = 'Enviar';
  };
  return () => unsub();
}

/* ---------- linha do tempo ---------- */
function mountTimeline(box, p) {
  const canPost = S.admin;
  box.innerHTML = `${canPost ? `<form class="card" id="andForm" style="margin-bottom:1.4rem"><div class="eyebrow">Novo andamento</div>
    <div class="row2"><div class="field"><label>Título</label><input name="titulo" required maxlength="120" placeholder="Ex.: Audiência designada"></div>
    <div class="field"><label>Data</label><input name="data" type="date" required></div></div>
    <div class="field"><label>Descrição (o cliente vai ler)</label><textarea name="texto" maxlength="4000" placeholder="Explique em linguagem simples o que aconteceu e os próximos passos."></textarea></div>
    <div class="chips" id="andChips" style="display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.8rem"></div><input type="file" id="andFile" multiple hidden>
    <label class="check"><input type="checkbox" name="avisar" checked><span>Avisar o cliente por e-mail</span></label>
    <p class="msg-err" id="andErr"></p>
    <div style="display:flex;gap:.6rem;flex-wrap:wrap"><button type="button" class="btn ghost sm" id="andAttach" >📎 Anexar</button><button class="btn sm" id="andBtn">Publicar andamento</button></div></form>` : ''}
    <div class="tl" id="tl"></div>`;
  const tl = $('#tl', box); let items = [], files = [];
  const draw = () => {
    tl.innerHTML = items.length ? items.map(a => `<div class="tl-i">${canPost ? `<button class="x" data-del="${a.id}" title="Excluir">✕</button>` : ''}<div class="d">${fmtISO(a.data) || fmtD(a.criadoAt)}</div><h4>${esc(a.titulo)}</h4>${a.texto ? `<p>${esc(a.texto)}</p>` : ''}${attHtml(a.anexos)}</div>`).join('')
      : `<div class="empty" style="margin-left:-1.6rem"><b>Sem andamentos ainda</b>${canPost ? 'Publique o primeiro andamento acima.' : 'Quando houver novidades, elas aparecem aqui e você recebe um aviso.'}</div>`;
  };
  const unsub = onSnapshot(collection(db, 'processos', p.id, 'andamentos'), snap => {
    items = snap.docs.map(d => ({ id: d.id, ...d.data({ serverTimestamps: 'estimate' }) })).sort((a, b) => (b.data || '').localeCompare(a.data || '') || ms(b.criadoAt) - ms(a.criadoAt)); draw();
  });
  if (!S.admin && procUnread(S.processos.find(x => x.id === p.id) || p)) updateDoc(doc(db, 'processos', p.id), { lidoCliente: serverTimestamp() }).catch(() => {});
  if (canPost) {
    const f = $('#andForm', box); f.data.value = new Date().toISOString().slice(0, 10);
    const chips = $('#andChips', box), fi = $('#andFile', box);
    const dc = () => { chips.innerHTML = files.map((x, i) => `<span class="att">📎 ${esc(x.name)} <button type="button" data-rm="${i}" style="background:none;border:none;color:var(--bad)">✕</button></span>`).join(''); };
    $('#andAttach', box).onclick = () => fi.click();
    fi.onchange = () => { acceptFiles(fi, files); dc(); };
    chips.onclick = e => { const b = e.target.closest('[data-rm]'); if (b) { files.splice(+b.dataset.rm, 1); dc(); } };
    f.onsubmit = async e => {
      e.preventDefault(); const btn = $('#andBtn', box); btn.disabled = true; btn.textContent = 'Publicando…'; $('#andErr', box).textContent = '';
      try {
        const anexos = files.length ? await uploadFiles(files, 'p', p.id) : [];
        await addDoc(collection(db, 'processos', p.id, 'andamentos'), { titulo: f.titulo.value.trim(), texto: f.texto.value.trim(), data: f.data.value, anexos, criadoAt: serverTimestamp() });
        await updateDoc(doc(db, 'processos', p.id), { atualizadoAt: serverTimestamp(), ultimoAviso: 'Novo andamento: ' + f.titulo.value.trim() });
        if (f.avisar.checked) notify('andamento', p.id);
        f.titulo.value = ''; f.texto.value = ''; files = []; dc(); toast('Andamento publicado.');
      } catch (x) { $('#andErr', box).textContent = x.message || errMsg(x); }
      btn.disabled = false; btn.textContent = 'Publicar andamento';
    };
    tl.onclick = async e => {
      const b = e.target.closest('[data-del]'); if (!b) return;
      if (await confirmBox('Excluir este andamento? O cliente deixará de vê-lo.', 'Excluir')) deleteDoc(doc(db, 'processos', p.id, 'andamentos', b.dataset.del)).catch(x => toast(errMsg(x), true));
    };
  }
  return () => unsub();
}

/* ---------- processo ---------- */
function formProcesso(p, clienteUidFixo, done) {
  const novo = !p;
  const clientes = [...S.clientes].sort((a, b) => (a.nome || '').localeCompare(b.nome || ''));
  openModal(`<h2>${novo ? 'Novo processo' : 'Editar processo'}</h2>
    <form id="pForm">
    ${novo ? `<div class="field"><label>Cliente</label><select name="cliente" required><option value="">Selecione…</option>${clientes.map(c => `<option value="${c.id}" ${c.id === clienteUidFixo ? 'selected' : ''}>${esc(c.nome)} · ${esc(c.email)}</option>`).join('')}</select>
      ${clientes.length ? '' : '<small>Nenhum cliente cadastrado ainda. Em “Clientes”, use “Convidar cliente” para enviar o link de cadastro.</small>'}</div>` : ''}
    <div class="row2"><div class="field"><label>Número do processo</label><input name="numero" required maxlength="60" value="${esc(p?.numero)}" placeholder="0000000-00.0000.0.00.0000"></div>
    <div class="field"><label>Início</label><input name="inicio" type="date" value="${esc(p?.inicio)}"></div></div>
    <div class="row2"><div class="field"><label>Área / tipo da ação</label><input name="tipo" list="areasL" maxlength="80" value="${esc(p?.tipo)}"><datalist id="areasL">${AREAS.map(a => `<option value="${a}">`).join('')}</datalist></div>
    <div class="field"><label>Status</label><select name="status">${STATUS.map(s => `<option value="${s[0]}" ${(p?.status || 'andamento') === s[0] ? 'selected' : ''}>${s[1]}</option>`).join('')}</select></div></div>
    <div class="field"><label>Vara / tribunal</label><input name="vara" maxlength="120" value="${esc(p?.vara)}" placeholder="Ex.: 3ª Vara Cível de Brasília — TJDFT"></div>
    <div class="field"><label>Resumo (visível ao cliente)</label><textarea name="descricao" maxlength="2000">${esc(p?.descricao)}</textarea></div>
    <p class="msg-err" id="pErr"></p>
    <div class="acts"><button type="button" class="btn ghost sm" data-close2>Cancelar</button><button class="btn sm">${novo ? 'Criar processo' : 'Salvar'}</button></div></form>`,
  (m, close) => {
    $('[data-close2]', m).onclick = close;
    $('#pForm', m).onsubmit = async e => {
      e.preventDefault(); const f = e.target, btn = $('.btn:not(.ghost)', f); btn.disabled = true;
      try {
        const base = { numero: f.numero.value.trim(), tipo: f.tipo.value.trim(), status: f.status.value, vara: f.vara.value.trim(), descricao: f.descricao.value.trim(), inicio: f.inicio.value };
        if (novo) {
          const uid = f.cliente.value; if (!uid) throw new Error('Escolha o cliente.');
          const ref = doc(collection(db, 'processos'));
          await setDoc(ref, { ...base, clienteUid: uid, clienteNome: clienteById(uid)?.nome || '', criadoAt: serverTimestamp(), atualizadoAt: serverTimestamp(), ultimoAviso: 'Processo cadastrado' });
          await setDoc(doc(db, 'chats', ref.id), { clienteUid: uid, processoId: ref.id, titulo: (base.tipo || 'Processo') + ' · ' + base.numero, criadoAt: serverTimestamp() });
          notify('andamento', ref.id); close(); toast('Processo criado.'); location.hash = '#/p/' + ref.id;
        } else {
          const mudouStatus = base.status !== p.status;
          await updateDoc(doc(db, 'processos', p.id), { ...base, ...(mudouStatus ? { atualizadoAt: serverTimestamp(), ultimoAviso: 'Status: ' + statusOf(base.status)[1] } : {}) });
          if (mudouStatus) notify('andamento', p.id);
          close(); toast('Processo atualizado.'); done && done();
        }
      } catch (x) { $('#pErr', m).textContent = x.message || errMsg(x); btn.disabled = false; }
    };
  });
}
/* ---------- documentos do processo ---------- */
const DOC_ST = { pendente: ['⏳ Aguardando envio', 'dpend', 'pend'], enviado: ['📥 Enviado — aguardando conferência', 'denv', 'env'], recebido: ['✔ Recebido', 'drec', 'rec'] };
const DOC_SUG = ['RG e CPF', 'Comprovante de residência', 'Procuração assinada', 'Contrato de honorários', 'Certidão de casamento/nascimento', 'Comprovante de renda', 'Extrato bancário', 'Documentos do imóvel', 'Fotos / provas'];
const docsOf = pid => S.docs[pid] || [];
const docsPend = pid => docsOf(pid).filter(d => S.admin ? d.status === 'enviado' : d.status === 'pendente').length;
function syncDocs() {
  S.processos.forEach(p => { if (S.docSub.has(p.id)) return; S.docSub.add(p.id);
    listen(collection(db, 'processos', p.id, 'documentos'), s => { S.docs[p.id] = docs(s); onData(); }); });
}
async function postDocChat(pid, texto, anexos) {
  const nome = S.profile?.nome || S.user.displayName || S.user.email;
  await addDoc(collection(db, 'chats', pid, 'msgs'), { autorUid: S.user.uid, autorNome: nome, autorTipo: 'cliente', texto, anexos, criadoAt: serverTimestamp() });
  await updateDoc(doc(db, 'chats', pid), { ultimaMsgAt: serverTimestamp(), ultimaMsgPor: 'cliente', ultimaMsgTexto: texto.slice(0, 90), lidoCliente: serverTimestamp() });
  notify('msg', pid);
}
function mountDocs(box, p) {
  const id = p.id, col = collection(db, 'processos', id, 'documentos');
  box.innerHTML = `<div class="card"><div class="dh"><div><div class="eyebrow">Documentos do processo</div>
    <p class="hint">${S.admin ? 'Solicite documentos ao cliente. Quando ele enviar, você recebe o aviso e confere aqui.' : 'Aqui aparecem os documentos que a advogada pediu. Envie o arquivo em cada item, ou mande qualquer outro documento do processo.'} (${limitTxt()})</p></div>
    <div style="display:flex;gap:.5rem;flex-wrap:wrap">${S.admin ? '<button class="btn sm" id="dReq">＋ Solicitar documento</button>' : '<button class="btn sm" id="dNew">⬆ Enviar documento</button>'}</div></div>
    <div class="dl" id="dl"></div></div><input type="file" id="dFile" multiple hidden>`;
  const fileIn = $('#dFile', box); let target = null, busy = false;
  let list = [];

    const rank = { pendente: 0, enviado: 1, recebido: 2 };
    const l = [...list].sort((a, b) => rank[a.status] - rank[b.status] || ms(b.criadoAt) - ms(a.criadoAt));
    $('#dl', box).innerHTML = l.length ? l.map(d => { const st = DOC_ST[d.status] || DOC_ST.pendente;
      return `<div class="dc ${st[2]}" data-id="${d.id}"><div class="top2"><div><h4>${esc(d.titulo)}</h4>${d.descricao ? `<p>${esc(d.descricao)}</p>` : ''}</div><span class="${st[1]}" style="font-size:.68rem;letter-spacing:.05em">${st[0]}</span></div>
      ${attHtml(d.anexos)}<small>${d.solicitadoPor === 'cliente' ? 'Enviado pelo cliente' : 'Solicitado pela advogada'} em ${fmtD(d.criadoAt)}${d.enviadoAt ? ' · arquivo enviado em ' + fmtD(d.enviadoAt) : ''}</small>
      <div class="acts2">${S.admin
        ? `${d.status === 'enviado' ? '<button class="btn sm" data-a="ok">Marcar como recebido</button>' : ''}${d.status === 'recebido' ? '<button class="btn ghost sm" data-a="reopen">Reabrir</button>' : ''}<button class="btn ghost sm" data-a="del">Excluir</button>`
        : (d.status !== 'recebido' && d.solicitadoPor === 'adv' ? `<button class="btn sm" data-a="up">${d.status === 'pendente' ? '⬆ Enviar arquivo' : '＋ Enviar outro arquivo'}</button>` : '')}</div></div>`; }).join('')
      : `<div class="empty"><b>${S.admin ? 'Nenhum documento solicitado' : 'Nenhum documento por aqui ainda'}</b>${S.admin ? 'Clique em “Solicitar documento” para pedir algo ao cliente.' : 'Quando a advogada pedir um documento, ele aparece aqui. Você também pode enviar um por conta própria.'}</div>`;
  };
  const unsub = onSnapshot(col, snap => { list = docs(snap); S.docs[id] = list; draw(); S.view?.tabsRefresh?.(); }, () => { $('#dl', box).innerHTML = '<div class="empty">Não foi possível carregar os documentos.</div>'; });

    if (busy || !files.length) return; busy = true; toast('Enviando…');
    try {
      const anexos = await uploadFiles(files, 'p', id);
      if (d) await updateDoc(doc(db, 'processos', id, 'documentos', d.id), { anexos: [...(d.anexos || []), ...anexos], status: 'enviado', enviadoAt: serverTimestamp(), atualizadoAt: serverTimestamp() });
      else await addDoc(col, { titulo: titulo.slice(0, 120), descricao: '', status: 'enviado', solicitadoPor: 'cliente', anexos, criadoAt: serverTimestamp(), enviadoAt: serverTimestamp(), atualizadoAt: serverTimestamp() });
      await postDocChat(id, '📎 Documento enviado: ' + (d ? d.titulo : titulo), anexos);
      toast('Documento enviado. A advogada foi avisada.');

  box.onclick = async e => {

      else if (b.dataset.a === 'reopen') { await updateDoc(ref, { status: 'enviado', atualizadoAt: serverTimestamp() }); }
      else if (b.dataset.a === 'del') { if (await confirmBox('Excluir o documento “' + esc(d.titulo) + '” da lista?', 'Excluir')) { await deleteDoc(ref); toast('Excluído.'); } }

  if (bReq) bReq.onclick = () => openModal(`<h2>Solicitar documento</h2><form id="rF">
      <div class="field"><label>Qual documento?</label><input name="t" required maxlength="120" list="dsug" placeholder="Ex.: Comprovante de residência"><datalist id="dsug">${DOC_SUG.map(x => `<option value="${x}">`).join('')}</datalist></div>

      <p class="msg-err" id="rE"></p><div class="acts"><button type="button" class="btn ghost sm" data-c>Cancelar</button><button class="btn sm">Solicitar</button></div></form>`,
    (m, close) => { $('[data-c]', m).onclick = close; $('#rF', m).onsubmit = async ev => {
      ev.preventDefault(); const f = ev.target, bt = $('.btn:not(.ghost)', f); bt.disabled = true;
      try {
        const t = f.t.value.trim();
        await addDoc(col, { titulo: t, descricao: f.d.value.trim(), status: 'pendente', solicitadoPor: 'adv', anexos: [], criadoAt: serverTimestamp(), atualizadoAt: serverTimestamp() });
        await updateDoc(doc(db, 'processos', id), { atualizadoAt: serverTimestamp(), ultimoAviso: 'Documento solicitado: ' + t }); notify('andamento', id);
        close(); toast('Solicitação enviada ao cliente.');
      } catch (x) { $('#rE', m).textContent = errMsg(x); bt.disabled = false; } }; });
  if (bNew) bNew.onclick = () => { let fl = []; openModal(`<h2>Enviar documento</h2><form id="nF">

function viewAgenda() {

    if (S.agDia) l = l.filter(e => dayKey(evStart(e)) === S.agDia).sort(ord);
    else if (aba === 'prox') l = l.filter(evFuturo).sort(ord);
    else if (aba === 'pass') l = l.filter(e => !evFuturo(e)).sort((a, b) => ord(b, a));
    else l = l.sort((a, b) => ord(b, a));
    $('#evL', box).innerHTML = l.length ? l.map(evCard).join('') : `<div class="empty"><b>Nenhum compromisso ${S.agDia ? 'neste dia' : aba === 'prox' ? 'marcado' : 'por aqui'}</b>${S.admin ? 'Use “Novo compromisso” para agendar uma audiência ou reunião.' : 'Quando a advogada marcar uma audiência ou reunião, ela aparece aqui. Você também pode pedir um horário.'}</div>`;
  };
  box.onclick = async e => {
    const m = e.target.closest('[data-m]'), dy = e.target.closest('[data-day]'), t = e.target.closest('[data-t]'), a = e.target.closest('[data-a]');
    if (m) { const d = new Date(S.agMes); S.agMes = new Date(d.getFullYear(), d.getMonth() + +m.dataset.m, 1).getTime(); draw(); }
    else if (dy) { S.agDia = S.agDia === dy.dataset.day ? '' : dy.dataset.day; draw(); }

    else if (t) { aba = t.dataset.t; S.agDia = ''; draw(); }
    else if (a) {
      const ev = S.eventos.find(x => x.id === a.closest('.ev').dataset.id); if (!ev) return; const ref = doc(db, 'eventos', ev.id);
      try {
        if (a.dataset.a === 'ics') downloadIcs(ev);
        else if (a.dataset.a === 'edit') formEvento(ev);
        else if (a.dataset.a === 'ok') { await updateDoc(ref, { status: 'agendado', atualizadoAt: serverTimestamp() }); await postEventChat(ev.clienteUid, '✅ Reunião confirmada: ' + evResumo(ev)); toast('Confirmado e cliente avisado.'); }
        else if (a.dataset.a === 'done') { await updateDoc(ref, { status: 'realizado', atualizadoAt: serverTimestamp() }); toast('Marcado como realizado.'); }
        else if (a.dataset.a === 'cancel') { if (await confirmBox('Cancelar “' + esc(ev.titulo) + '”?', 'Cancelar compromisso')) { await updateDoc(ref, { status: 'cancelado', atualizadoAt: serverTimestamp() }); await postEventChat(ev.clienteUid, '❌ Compromisso cancelado: ' + evResumo(ev)); toast('Cancelado.'); } }
        else if (a.dataset.a === 'del') { if (await confirmBox('Excluir “' + esc(ev.titulo) + '” da agenda?', 'Excluir')) { await deleteDoc(ref); toast('Excluído.'); } }
      } catch (x) { toast(errMsg(x), true); }
    }
  };
  $('#evNew', box).onclick = () => formEvento(null);
  draw(); return { refresh: draw };
}
