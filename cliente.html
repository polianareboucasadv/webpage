    </div>`;
  };
  $('#dEv', box).onclick = () => formEvento(null); $('#dNp', box).onclick = () => formProcesso(null, null);
  draw(); return { refresh: draw };
}
function viewAdminHome() {
  const box = $('#main'); let q = '', st = '';
  box.innerHTML = `<div class="page-h"><div><div class="eyebrow">Painel</div><h1>Processos em <em>atuação</em></h1></div><div style="display:flex;gap:.5rem;flex-wrap:wrap"><button class="btn ghost" id="inv">Convidar cliente</button><button class="btn" id="np">＋ Novo processo</button></div></div>
    <div id="cs"></div><div class="toolbar"><input id="q" placeholder="Buscar por número, cliente ou tipo…"><select id="st"><option value="">Todos os status</option>${STATUS.map(s => `<option value="${s[0]}">${s[1]}</option>`).join('')}</select></div><div class="list" id="ls"></div>`;
  const draw = () => {
    const ps = S.processos;
    $('#cs', box).innerHTML = `<div class="cards">${stat(ps.filter(p => !['concluido', 'arquivado'].includes(p.status)).length, 'Processos ativos')}${stat(ps.filter(p => p.status === 'cliente').length, 'Aguardando cliente')}${stat(S.chats.filter(chatUnread).length, 'Mensagens novas')}${stat(S.clientes.length, 'Clientes')}</div>`;
    const t = q.toLowerCase();
    const l = ps.filter(p => (!st || p.status === st) && (!t || [p.numero, p.tipo, p.vara, clienteNome(p.clienteUid)].join(' ').toLowerCase().includes(t))).sort((a, b) => ms(b.atualizadoAt) - ms(a.atualizadoAt));
    $('#ls', box).innerHTML = l.length ? l.map(p => { const c = S.chats.find(x => x.id === p.id); return `<a class="item" href="#/p/${p.id}"><div class="main"><h3>${esc(p.numero)} ${c && chatUnread(c) ? '<span class="dot" title="Mensagem nova"></span>' : ''}</h3><p>${esc(clienteNome(p.clienteUid))} · ${esc(p.tipo || 'Processo')}${p.vara ? ' · ' + esc(p.vara) : ''}</p></div><div class="side">${chip(p.status)}<span>${fmtD(p.atualizadoAt)}</span></div></a>`; }).join('')
      : `<div class="empty"><b>${ps.length ? 'Nada encontrado' : 'Nenhum processo cadastrado'}</b>${ps.length ? 'Ajuste a busca ou o filtro.' : 'Convide seus clientes e cadastre o primeiro processo.'}</div>`;
  };
  $('#q', box).oninput = e => { q = e.target.value; draw(); }; $('#st', box).onchange = e => { st = e.target.value; draw(); };
  $('#np', box).onclick = () => formProcesso(null, null); $('#inv', box).onclick = convidar;
  draw(); return { refresh: draw };
}
function viewClients() {
  const box = $('#main'); let q = '';
  box.innerHTML = `<div class="page-h"><div><div class="eyebrow">Cadastro</div><h1><em>Clientes</em></h1></div><button class="btn" id="inv">Convidar cliente</button></div>
    <div class="toolbar"><input id="q" placeholder="Buscar por nome, e-mail ou telefone…"></div><div class="list" id="ls"></div>`;
  const draw = () => {
    const t = q.toLowerCase();
    const l = [...S.clientes].filter(c => !t || [c.nome, c.email, c.telefone].join(' ').toLowerCase().includes(t)).sort((a, b) => (a.nome || '').localeCompare(b.nome || ''));
    $('#ls', box).innerHTML = l.length ? l.map(c => { const n = S.processos.filter(p => p.clienteUid === c.id).length, ch = S.chats.find(x => x.id === c.id); return `<a class="item" href="#/c/${c.id}"><div class="main"><h3>${esc(c.nome)} ${ch && chatUnread(ch) ? '<span class="dot"></span>' : ''}</h3><p>${esc(c.email)} · ${esc(c.telefone)}</p></div><div class="side"><span>${n} processo${n === 1 ? '' : 's'}</span><span>Desde ${fmtD(c.criadoEm)}</span></div></a>`; }).join('')
      : `<div class="empty"><b>${S.clientes.length ? 'Nada encontrado' : 'Nenhum cliente cadastrado'}</b>${S.clientes.length ? '' : 'Use “Convidar cliente” para enviar o link de cadastro.'}</div>`;
  };
  $('#q', box).oninput = e => { q = e.target.value; draw(); }; $('#inv', box).onclick = convidar;
  draw(); return { refresh: draw };
}
function viewClientDetail(uid) {
  const box = $('#main'), c = clienteById(uid);
  if (!c) { box.innerHTML = `<a class="back" href="#/clientes">← Clientes</a><div class="empty"><b>Cliente não encontrado</b></div>`; return { refresh() { if (clienteById(uid)) route(); } }; }
  box.innerHTML = `<a class="back" href="#/clientes">← Clientes</a><div class="page-h"><div><div class="eyebrow">Cliente</div><h1>${esc(c.nome)}</h1><p>${esc(c.email)}</p></div>
    <div style="display:flex;gap:.5rem;flex-wrap:wrap"><a class="btn ghost" href="#/chat/${uid}">💬 Conversa</a><button class="btn" id="np">＋ Novo processo</button></div></div>
    <form class="card" id="cf" style="max-width:640px;margin-bottom:1.6rem"><div class="row2"><div class="field"><label>Nome</label><input name="nome" value="${esc(c.nome)}" maxlength="150" required></div><div class="field"><label>Telefone</label><input name="tel" value="${esc(c.telefone)}" maxlength="40"></div></div>
    <div class="field"><label>CPF</label><input name="doc" value="${esc(c.documento)}" maxlength="30"></div><button class="btn sm">Salvar dados</button></form>
    <div class="eyebrow">Processos deste cliente</div><div class="list" id="ls"></div>`;
  $('#np', box).onclick = () => formProcesso(null, uid);
  $('#cf', box).onsubmit = async e => { e.preventDefault(); const f = e.target; try { await updateDoc(doc(db, 'clientes', uid), { nome: f.nome.value.trim(), telefone: f.tel.value.trim(), documento: f.doc.value.trim(), atualizadoEm: serverTimestamp() }); toast('Dados salvos.'); } catch (x) { toast(errMsg(x), true); } };
  const draw = () => {
    const ps = S.processos.filter(p => p.clienteUid === uid).sort((a, b) => ms(b.atualizadoAt) - ms(a.atualizadoAt));
    $('#ls', box).innerHTML = ps.length ? ps.map(p => `<a class="item" href="#/p/${p.id}"><div class="main"><h3>${esc(p.numero)}</h3><p>${esc(p.tipo || '')}${p.vara ? ' · ' + esc(p.vara) : ''}</p></div><div class="side">${chip(p.status)}<span>${fmtD(p.atualizadoAt)}</span></div></a>`).join('') : '<div class="empty">Nenhum processo para este cliente.</div>';
  };
  draw(); return { refresh: draw };
}
function viewAdminChats() {
  const box = $('#main');
  box.innerHTML = `<div class="page-h"><div><div class="eyebrow">Atendimento</div><h1><em>Conversas</em></h1><p>Mensagens dos clientes, gerais e por processo.</p></div></div><div class="list" id="ls"></div>`;
  const draw = () => {
    const l = S.chats.filter(c => c.ultimaMsgAt).sort((a, b) => ms(b.ultimaMsgAt) - ms(a.ultimaMsgAt));
    $('#ls', box).innerHTML = l.length ? l.map(c => `<a class="item" href="${chatHref(c)}"><div class="main"><h3>${esc(clienteNome(c.clienteUid))} ${chatUnread(c) ? '<span class="dot"></span>' : ''}</h3><p>${esc(chatTitle(c))} · ${c.ultimaMsgPor === 'adv' ? 'Você: ' : ''}${esc(c.ultimaMsgTexto || '')}</p></div><div class="side"><span>${fmtDT(c.ultimaMsgAt)}</span></div></a>`).join('') : '<div class="empty"><b>Nenhuma conversa ainda</b>Quando um cliente escrever, a conversa aparece aqui.</div>';
  };
  draw(); return { refresh: draw };
}
function viewAdminChat(id) {
  const box = $('#main'), c = clienteById(id);
  box.innerHTML = `<a class="back" href="#/mensagens">← Conversas</a><div class="page-h"><div><div class="eyebrow">Conversa geral</div><h1>${esc(c?.nome || 'Cliente')}</h1></div>${c ? `<a class="btn ghost" href="#/c/${id}">Ver cadastro</a>` : ''}</div><div id="cb"></div>`;
  const un = mountChat($('#cb', box), id); return { destroy: un };
}
function viewConfig() {
  const box = $('#main');
  box.innerHTML = `<div class="page-h"><div><div class="eyebrow">Sistema</div><h1><em>Configurações</em></h1></div></div>
    <div class="card" style="max-width:700px"><div class="eyebrow">E-mails de aviso e arquivos grandes (Cloudflare) · opcional</div>
    <p class="hint" style="margin-bottom:1rem">O portal já funciona sem isto: mensagens, processos, sino de novidades e arquivos leves (até 700 KB, fotos são reduzidas automaticamente). Para receber <b>avisos por e-mail</b> e liberar arquivos de até 15 MB, cole aqui o endereço do seu Cloudflare Worker (termina em <b>workers.dev</b>).</p>
    <div class="field"><label>Endereço do Worker</label><input id="wk" placeholder="https://portal-poliana.seuusuario.workers.dev" value="${esc(S.workerUrl)}"></div><p class="msg-err" id="wkE"></p>
    <div style="display:flex;gap:.6rem;flex-wrap:wrap"><button class="btn sm" id="wkS">Salvar</button><button class="btn ghost sm" id="wkT">Testar conexão</button></div></div>`;
  if (S.siteAdmin) {
    const ad = document.createElement('div'); ad.className = 'card'; ad.style.cssText = 'max-width:700px;margin-bottom:1.2rem';
    ad.innerHTML = `<div class="eyebrow">Área do administrador</div><p class="hint" style="margin-bottom:1rem">Edite textos, fotos, logotipo, cores e artigos do site. Lá você salva e volta para a gestão ou para o site quando quiser.</p><button class="btn" id="goAdm">🛠 Área do administrador (editar o site)</button>`;
    box.insertBefore(ad, box.children[1]); $('#goAdm', ad).onclick = () => { try { sessionStorage.setItem('pr_edit', '1'); } catch { /* ok */ } location.href = 'index.html?editar=1'; };
  }
  if (S.main) {
    const ac = document.createElement('div'); ac.className = 'card'; ac.style.cssText = 'max-width:700px;margin-top:1.2rem';
    ac.innerHTML = `<div class="eyebrow">Acessos de gestão e administração</div>
      <p class="hint" style="margin-bottom:1rem">Somente você (administrador principal) cadastra acessos. <b>Advogado(a)</b> usa a gestão (clientes, processos, agenda, tarefas). <b>Administrador</b> também edita o site. Cada pessoa entra por “Área restrita” no site, com e-mail e senha cadastrados.</p>
      <div id="acL" style="margin-bottom:1rem"><p class="hint">Carregando…</p></div>
      <form id="acF"><div class="row2"><div class="field"><label>E-mail</label><input name="e" type="email" required maxlength="120" placeholder="nome@email.com"></div>
      <div class="field"><label>Perfil</label><select name="p"><option value="adv">Advogado(a) — gestão</option><option value="adm">Administrador — gestão + editar o site</option></select></div></div><p class="msg-err" id="acE"></p><button class="btn sm">＋ Cadastrar acesso</button></form>`;
    box.appendChild(ac);
    const loadAc = async () => {
      try {
        const [a, l] = await Promise.all([getDocs(collection(db, 'admins')), getDocs(collection(db, 'advogados'))]);
        const m = new Map(); l.docs.forEach(d => m.set(d.id, { adv: true })); a.docs.forEach(d => m.set(d.id, { ...(m.get(d.id) || {}), adm: true }));
        const rows = [...m.entries()].filter(([e]) => e !== MAIN_ADMIN);
        $('#acL', ac).innerHTML = `<div class="mini"><div><span>👑 ${MAIN_ADMIN}<br><small style="text-align:left">Administrador principal</small></span></div>${rows.map(([e, v]) => `<div><span>${esc(e)}<br><small style="text-align:left">${v.adm ? 'Administrador' + (v.adv ? ' + gestão' : ' (só edita o site)') : 'Advogado(a) — gestão'}</small></span><button class="btn ghost sm" data-rm="${esc(e)}">Remover</button></div>`).join('')}</div>`;
      } catch (x) { $('#acL', ac).innerHTML = `<p class="msg-err">${esc(errMsg(x))}</p>`; }
    };
    loadAc();
    ac.onclick = async e => { const b = e.target.closest('[data-rm]'); if (!b) return; if (await confirmBox('Remover o acesso de <b>' + esc(b.dataset.rm) + '</b>?', 'Remover')) { try { await Promise.all([deleteDoc(doc(db, 'admins', b.dataset.rm)), deleteDoc(doc(db, 'advogados', b.dataset.rm))]); toast('Acesso removido.'); loadAc(); } catch (x) { toast(errMsg(x), true); } } };
    $('#acF', ac).onsubmit = async e => { e.preventDefault(); const f = e.target, em = f.e.value.trim().toLowerCase(), perfil = f.p.value;
      try { await setDoc(doc(db, 'advogados', em), { email: em, perfil, criadoAt: serverTimestamp() }); if (perfil === 'adm') await setDoc(doc(db, 'admins', em), { email: em, criadoAt: serverTimestamp() }); else await deleteDoc(doc(db, 'admins', em)).catch(() => {}); f.reset(); $('#acE', ac).textContent = ''; toast('Acesso cadastrado.'); loadAc(); } catch (x) { $('#acE', ac).textContent = errMsg(x); } };
  }
  const eq = document.createElement('div'); eq.className = 'card'; eq.style.cssText = 'max-width:700px;margin-top:1.2rem';
  eq.innerHTML = `<div class="eyebrow">Equipe do escritório</div>
    <p class="hint" style="margin-bottom:1rem">Membros da equipe veem <b>apenas o quadro de Tarefas</b> (não acessam clientes, processos nem conversas). Cadastre o e-mail abaixo; a pessoa entra em “Área do cliente” → <b>Criar conta</b> com esse mesmo e-mail (ou Google) e já cai no quadro.</p>
    <div id="eqL" style="margin-bottom:1rem"></div>
    <form id="eqF"><div class="row2"><div class="field"><label>Nome</label><input name="n" required maxlength="80" placeholder="Nome do membro"></div><div class="field"><label>E-mail</label><input name="e" type="email" required maxlength="120" placeholder="nome@email.com"></div></div>
    <div class="field"><label>Função (opcional)</label><input name="f" maxlength="60" placeholder="Ex.: Estagiária, Assistente"></div><p class="msg-err" id="eqE"></p><button class="btn sm">＋ Adicionar à equipe</button></form>`;
  box.appendChild(eq);
  const drawEq = () => { $('#eqL', eq).innerHTML = S.equipe.length ? S.equipe.map(m => `<div class="mini"><div><span>👥 ${esc(m.nome)}${m.funcao ? ' · ' + esc(m.funcao) : ''}<br><small style="text-align:left">${esc(m.id)}</small></span><button class="btn ghost sm" data-rm="${esc(m.id)}">Remover</button></div></div>`).join('') : '<p class="hint">Nenhum membro cadastrado ainda.</p>'; };
  drawEq();
  eq.onclick = async e => { const b = e.target.closest('[data-rm]'); if (!b) return; if (await confirmBox('Remover <b>' + esc(b.dataset.rm) + '</b> da equipe? A pessoa perde o acesso ao quadro.', 'Remover')) { try { await deleteDoc(doc(db, 'equipe', b.dataset.rm)); toast('Removido.'); } catch (x) { toast(errMsg(x), true); } } };
  $('#eqF', eq).onsubmit = async e => { e.preventDefault(); const f = e.target, em = f.e.value.trim().toLowerCase();
    try { await setDoc(doc(db, 'equipe', em), { nome: f.n.value.trim(), email: em, funcao: f.f.value.trim(), criadoAt: serverTimestamp() }); f.reset(); $('#eqE', eq).textContent = ''; toast('Membro adicionado.'); } catch (x) { $('#eqE', eq).textContent = errMsg(x); } };
  $('#wkS', box).onclick = async () => {
    const v = $('#wk', box).value.trim().replace(/\/$/, '');
    if (v && !/^https:\/\/[\w.-]+/.test(v)) return $('#wkE', box).textContent = 'O endereço deve começar com https://';
    let r2 = false; if (v) { try { r2 = !!(await (await fetch(v + '/health')).json()).r2; } catch { r2 = false; } }
    try { await setDoc(doc(db, 'site', 'portal'), { workerUrl: v, r2 }, { merge: true }); S.workerUrl = v; S.r2 = r2; $('#wkE', box).textContent = ''; toast('Configuração salva.'); } catch (x) { $('#wkE', box).textContent = errMsg(x); }
  };
  $('#wkT', box).onclick = async () => {
    const v = $('#wk', box).value.trim().replace(/\/$/, ''); if (!v) return toast('Informe o endereço do Worker.', true);
    try { const r = await fetch(v + '/health'); const j = await r.json(); toast(j.ok ? `Conexão OK · arquivos: ${j.r2 ? 'sim' : 'NÃO configurado'} · e-mail: ${j.mail ? 'sim' : 'NÃO configurado'}` : 'Respondeu, mas algo está errado.', !j.ok); } catch { toast('Não foi possível conectar. Confira o endereço.', true); }
  };
  return { refresh: drawEq };
}

/* ---------- rotas ---------- */
function route() {
  if (!S.user || !$('#main')) return;
  S.view?.destroy?.(); S.view = null;
  const [r, a, b] = location.hash.replace(/^#\/?/, '').split('/');
  $$('[data-nav]').forEach(n => { const h = n.dataset.nav.replace('#/', ''); n.classList.toggle('on', h === (r === 'p' ? (S.admin ? 'processos' : '') : r === 'c' ? 'clientes' : r === 'chat' ? 'mensagens' : r || '')); });
  window.scrollTo(0, 0);
  if (S.team) S.view = viewTarefas();
  else if (r === 'p' && a) S.view = viewProcess(a, b);
  else if (S.admin) S.view = r === 'tarefas' ? viewTarefas() : r === 'processos' ? viewAdminHome() : r === 'agenda' ? viewAgenda() : r === 'clientes' ? viewClients() : r === 'c' && a ? viewClientDetail(a) : r === 'mensagens' ? viewAdminChats() : r === 'chat' && a ? viewAdminChat(a) : r === 'config' ? viewConfig() : viewDashboard();
  else S.view = r === 'agenda' ? viewAgenda() : r === 'mensagens' ? viewClientChat() : r === 'perfil' ? viewProfile() : viewClientHome();
}
window.addEventListener('hashchange', route);

/* ---------- início de sessão ---------- */
const listen = (q, fn) => S.unsubs.push(onSnapshot(q, fn, e => console.warn('listen', e.code)));
const docs = snap => snap.docs.map(d => ({ id: d.id, ...d.data({ serverTimestamps: 'estimate' }) }));
async function ensureProfile(user) {
  const ref = doc(db, 'clientes', user.uid), d = await getDoc(ref);
  if (!d.exists()) {
    await setDoc(ref, { uid: user.uid, nome: (S.pending?.nome || user.displayName || (user.email || '').split('@')[0]).slice(0, 150), email: (user.email || '').toLowerCase(), telefone: S.pending?.telefone || '', documento: '', notifEmail: true, criadoEm: serverTimestamp(), atualizadoEm: serverTimestamp() });
    S.pending = null;
  }
  // conversa geral (mesmos valores a cada acesso: não altera nada se já existir)
  await setDoc(doc(db, 'chats', user.uid), { clienteUid: user.uid, processoId: null, titulo: 'Conversa geral' }, { merge: true });
}
function stopAll() { S.unsubs.forEach(u => u()); S.unsubs = []; S.view?.destroy?.(); S.view = null; S.profile = null; S.clientes = []; S.processos = []; S.chats = []; S.seen = null; S.docs = {}; S.docSub = new Set(); S.eventos = []; S.team = false; S.equipe = []; S.tarefas = []; }
/* logotipo definido pela advogada no site (aparece no lugar do “PR”) */
function applyLogo() {
  if (!S.logo) return;
  $$('.brand').forEach(b => { if (b.dataset.logo) return; b.dataset.logo = '1';
    const small = b.querySelector('small'); b.innerHTML = `<img src="${S.logo}" alt="Logotipo" style="height:${b.closest('.auth') ? 56 : 34}px;width:auto;max-width:220px;object-fit:contain">` + (small && !b.closest('.auth') ? `<small>${small.textContent}</small>` : ''); });
}
new MutationObserver(applyLogo).observe(document.getElementById('root'), { childList: true, subtree: true });
getDoc(doc(db, 'site', 'content')).then(d => { S.logo = d.exists() && d.data().brand?.logo || ''; applyLogo(); }).catch(() => {});
onAuthStateChanged(auth, async user => {
  stopAll(); S.user = user;
  if (!user) { viewAuth(); document.title = 'Área do Cliente | Poliana Rebouças Advocacia'; return; }
  $('#root').innerHTML = '<div class="loading">Carregando…</div>';
  try {
    const email = (user.email || '').toLowerCase();
    S.admin = ADMIN_EMAILS.includes(email);
    if (!S.admin) { try { S.admin = (await getDoc(doc(db, 'advogados', email))).exists(); } catch { S.admin = false; } }
    S.main = email === MAIN_ADMIN; S.siteAdmin = S.main;
    if (!S.siteAdmin) { try { S.siteAdmin = (await getDoc(doc(db, 'admins', email))).exists(); } catch { S.siteAdmin = false; } }
    S.team = false;
    if (!S.admin) { try { S.team = (await getDoc(doc(db, 'equipe', email))).exists(); } catch { S.team = false; } }
    getDoc(doc(db, 'site', 'portal')).then(d => { if (d.exists()) { S.workerUrl = d.data().workerUrl || ''; S.r2 = !!d.data().r2; } }).catch(() => {});
    if (S.admin) {
      renderShell();
      listen(collection(db, 'clientes'), s => { S.clientes = docs(s); onData(); });
      listen(collection(db, 'processos'), s => { S.processos = docs(s); syncDocs(); onData(); });
      listen(collection(db, 'eventos'), s => { S.eventos = docs(s); onData(); });
      listen(collection(db, 'chats'), s => { S.chats = docs(s); onData(); });
      listen(collection(db, 'equipe'), s => { S.equipe = docs(s); onData(); });
      listen(collection(db, 'tarefas'), s => { S.tarefas = docs(s); onData(); });
    } else if (S.team) {
      renderShell();
      listen(collection(db, 'equipe'), s => { S.equipe = docs(s); onData(); });
      listen(collection(db, 'tarefas'), s => { S.tarefas = docs(s); onData(); });
    } else {
      await ensureProfile(user);
      renderShell();
      listen(doc(db, 'clientes', user.uid), s => { S.profile = s.exists() ? { id: s.id, ...s.data() } : null; updateWho(); });
      listen(query(collection(db, 'processos'), where('clienteUid', '==', user.uid)), s => { S.processos = docs(s); syncDocs(); onData(); });
      listen(query(collection(db, 'chats'), where('clienteUid', '==', user.uid)), s => { S.chats = docs(s); onData(); });
      listen(query(collection(db, 'eventos'), where('clienteUid', '==', user.uid)), s => { S.eventos = docs(s); onData(); });
    }
    renderBell(); route();
  } catch (e) {
    $('#root').innerHTML = `<div class="auth"><div class="card center"><h1>Ops</h1><p class="sub">${esc(errMsg(e))}</p><button class="btn" id="out">Sair</button></div></div>`;
    $('#out').onclick = () => signOut(auth);
  }
});
</script>
</body>
